name: Build Klips installers

# Push a tag like v1.0.0 to build the Mac and Windows downloads and attach them to a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Klips-mac
          - os: windows-latest
            artifact: Klips-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build the app
        run: >
          pyinstaller --noconfirm --clean --windowed --name Klips
          --collect-all mediapipe
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all imageio_ffmpeg
          --collect-data cv2
          --add-data "static:static"
          app.py

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname Klips -srcfolder dist/Klips.app -ov -format UDZO dist/Klips-mac.dmg

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Klips/* -DestinationPath dist/Klips-windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/dist/Klips-mac.dmg
            app/dist/Klips-windows.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/**/*
          generate_release_notes: true
