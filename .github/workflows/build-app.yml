name: Build Klips installers

# Every push to main that touches the desktop app builds and self-tests both installers.
# Pushing a version tag (v1.0.1, v1.1.0, ...) also publishes them as a GitHub release,
# which is where the Download buttons on klips.pro point.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-app.yml"
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Package the app
        run: >
          pyinstaller --noconfirm --clean --windowed --name Klips --osx-bundle-identifier pro.klips.engine
          --collect-all mediapipe
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all onnxruntime
          --collect-all av
          --collect-all imageio_ffmpeg
          --collect-data cv2
          --hidden-import app
          --add-data "static${{ runner.os == 'Windows' && ';' || ':' }}static"
          klips_desktop.py

      - name: Run as a background app on macOS (no Dock icon)
        if: runner.os == 'macOS'
        run: |
          plutil -insert LSUIElement -bool true dist/Klips.app/Contents/Info.plist
          codesign --force --deep --sign - dist/Klips.app
          codesign --verify --deep --strict dist/Klips.app

      - name: Self-test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: KLIPS_SMOKE_TEST=1 CLIPPER_DATA="$RUNNER_TEMP/klips-data" ./dist/Klips.app/Contents/MacOS/Klips

      - name: Self-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KLIPS_SMOKE_TEST = "1"
          $env:CLIPPER_DATA = "$env:RUNNER_TEMP\klips-data"
          $log = "$env:RUNNER_TEMP\smoke.log"
          $p = Start-Process -FilePath "dist\Klips\Klips.exe" -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Build the Mac disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg && cp -R dist/Klips.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Klips -srcfolder dmg -ov -format ULMO dist/Klips-mac.dmg

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "1.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\klips.iss

      - uses: actions/upload-artifact@v5
        with:
          name: Klips-${{ matrix.name }}
          path: |
            app/dist/Klips-mac.dmg
            app/dist/Klips-windows-setup.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            downloads/Klips-mac.dmg
            downloads/Klips-windows-setup.exe
          generate_release_notes: true
