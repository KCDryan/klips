name: Deploy klips.pro

# Manual only (Actions tab -> Run workflow). scripts/sync.sh already checks and deploys the website from this Mac,
# and running on every push used up the free GitHub Actions minutes.
# Deploys only when CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check Cloudflare setup
        id: setup
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice title=Deploy skipped::Cloudflare isn't connected yet. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions (SETUP.md step 5)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "PASTE_DATABASE_ID_AFTER_CREATING" wrangler.jsonc; then
            echo "::error title=Database not configured::Run 'npx wrangler d1 create klips' and paste the database_id into web/wrangler.jsonc (SETUP.md step 2)."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        if: steps.setup.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
